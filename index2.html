<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priority Stack - Expanded Detail</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 20px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.list {
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

.card {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    border-color: #3b82f6;
}

.top {
    display: flex;
    justify-content: space-between;
}

.rank {
    font-weight: bold;
    color: #60a5fa;
}

.title {
    font-weight: 600;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

/* EXPANDED PANEL */
.expanded {
    margin-top: 12px;
    border-top: 1px solid #1e293b;
    padding-top: 12px;
    display: none;
}

.section {
    margin-bottom: 12px;
}

.section-title {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 4px;
}

/* TAGS */
.badge {
    background: #1e293b;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 11px;
    margin-right: 4px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* LIST ITEMS */
.list-item {
    font-size: 12px;
    margin-bottom: 4px;
    color: #cbd5f5;
}

/* LINK STYLE */
.link {
    color: #38bdf8;
    cursor: pointer;
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="header">
    <h3>Global Priority Stack</h3>
</div>

<div id="list" class="list"></div>

<script>
const data = [
{
    id:1,
    title:"Fix payment processing bug",
    app:"Checkout",
    type:"Bug",
    impact:9,
    urgency:9,
    effort:3,
    age:5,
    notes:"Critical for revenue. Customers blocked.",
    decisions:[
        {date:"2026-04-10", text:"Approved in triage due to revenue impact"},
        {date:"2026-04-12", text:"Priority raised after escalation"}
    ],
    roles:{
        dev:"Chad",
        qa:"Sarah",
        ba:"Mike",
        dba:"Lisa"
    },
    work:[
        "DEV-1023 Payment Fix",
        "DEV-1044 API Retry Logic"
    ],
    activity:[
        "Tasks created in DevOps",
        "Development started",
        "Pending QA validation"
    ]
},
{
    id:2,
    title:"Add analytics dashboard",
    app:"Portal",
    type:"Feature",
    impact:8,
    urgency:6,
    effort:5,
    age:10,
    notes:"Requested by leadership for visibility.",
    decisions:[
        {date:"2026-04-08", text:"Approved for Q2 roadmap"}
    ],
    roles:{
        dev:"Alex",
        qa:"Nina",
        ba:"Chris",
        dba:"—"
    },
    work:[
        "DEV-1101 Dashboard UI",
        "DEV-1102 Metrics API"
    ],
    activity:[
        "Design phase complete",
        "Awaiting dev assignment"
    ]
}
];

function score(i){
    return i.impact*2 + i.urgency*2 + i.age - i.effort;
}

function render(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.sort((a,b)=> score(b)-score(a));

    data.forEach((item, index)=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="top">
                <div>
                    <span class="rank">#${index+1}</span>
                    <span class="title">${item.title}</span>
                </div>
                <div class="meta">${item.app} • ${item.type}</div>
            </div>

            <div class="meta">
                Impact ${item.impact} | Urgency ${item.urgency} | Effort ${item.effort}
            </div>

            <div class="expanded">
                <div class="grid">

                    <div>
                        <div class="section">
                            <div class="section-title">Notes</div>
                            <div class="list-item">${item.notes}</div>
                        </div>

                        <div class="section">
                            <div class="section-title">Decision History</div>
                            ${item.decisions.map(d=>`
                                <div class="list-item">${d.date} - ${d.text}</div>
                            `).join("")}
                        </div>
                    </div>

                    <div>
                        <div class="section">
                            <div class="section-title">Assignments</div>
                            <div class="list-item">Dev: ${item.roles.dev}</div>
                            <div class="list-item">QA: ${item.roles.qa}</div>
                            <div class="list-item">BA: ${item.roles.ba}</div>
                            <div class="list-item">DBA: ${item.roles.dba}</div>
                        </div>

                        <div class="section">
                            <div class="section-title">Linked Work</div>
                            ${item.work.map(w=>`
                                <div class="list-item link">${w}</div>
                            `).join("")}
                        </div>

                        <div class="section">
                            <div class="section-title">Activity</div>
                            ${item.activity.map(a=>`
                                <div class="list-item">${a}</div>
                            `).join("")}
                        </div>
                    </div>

                </div>
            </div>
        `;

        div.onclick = ()=>{
            const exp = div.querySelector(".expanded");
            exp.style.display = exp.style.display === "block" ? "none" : "block";
        };

        list.appendChild(div);
    });
}

render();
</script>

</body>
</html>
