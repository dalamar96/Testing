<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Priority Engine - Readable POC</title>

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

/* HEADER */
.header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-size: 18px;
    margin: 0;
}

.controls button {
    background: #1e293b;
    border: none;
    color: #e2e8f0;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 6px;
}

.controls button.active {
    background: #2563eb;
}

/* LIST */
.list {
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

/* CARD */
.card {
    display: grid;
    grid-template-columns: 70px 1fr 220px 140px;
    gap: 16px;
    align-items: center;
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: grab;
    transition: 0.2s;
}

.card:hover {
    border-color: #3b82f6;
    background: #020617;
}

.rank {
    font-size: 18px;
    font-weight: bold;
    color: #60a5fa;
}

/* MAIN CONTENT */
.main {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.title {
    font-size: 15px;
    font-weight: 600;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

/* TAGS */
.tags span {
    background: #1e293b;
    padding: 3px 8px;
    margin-right: 6px;
    border-radius: 6px;
    font-size: 11px;
}

/* SIGNALS */
.signals {
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    color: #cbd5f5;
}

/* PROGRESS */
.progress-wrap {
    font-size: 12px;
}

.progress {
    height: 6px;
    background: #1e293b;
    border-radius: 4px;
    margin-top: 4px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: #22c55e;
}

/* WHY PANEL */
.why {
    grid-column: span 4;
    font-size: 12px;
    color: #38bdf8;
    margin-top: 6px;
    display: none;
}

/* EXPANDED */
.expanded {
    grid-column: span 4;
    font-size: 12px;
    color: #cbd5f5;
    margin-top: 6px;
    display: none;
    border-top: 1px solid #1e293b;
    padding-top: 6px;
}

/* SKIPPED */
.skipped {
    color: #f87171;
}

/* DRAGGING */
.dragging {
    opacity: 0.4;
}
</style>
</head>

<body>

<div class="header">
    <h1>Global Priority Stack</h1>
    <div class="controls">
        <button id="toggleWhy">Why?</button>
    </div>
</div>

<div id="list" class="list"></div>

<script>
let showWhy = false;

const data = [
    {id:1, title:"Fix payment processing bug", type:"Bug", app:"Checkout", impact:9, urgency:9, effort:3, age:5, progress:40, skipped:0},
    {id:2, title:"Add user dashboard analytics", type:"Feature", app:"Portal", impact:8, urgency:6, effort:5, age:10, progress:10, skipped:0},
    {id:3, title:"Refactor auth system", type:"Initiative", app:"Core", impact:7, urgency:5, effort:8, age:20, progress:0, skipped:1},
    {id:4, title:"Fix mobile layout issue", type:"Bug", app:"Frontend", impact:6, urgency:8, effort:2, age:3, progress:60, skipped:0},
];

function score(item){
    return item.impact * 2 + item.urgency * 2 + item.age - item.effort;
}

function render(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.sort((a,b)=> score(b) - score(a));

    data.forEach((item, index)=>{
        const div = document.createElement("div");
        div.className = "card";
        div.draggable = true;
        div.dataset.id = item.id;

        div.innerHTML = `
            <div class="rank">#${index+1}</div>

            <div class="main">
                <div class="title">${item.title}</div>
                <div class="meta">${item.app} • ${item.type}</div>
                <div class="tags">
                    <span>Impact ${item.impact}</span>
                    <span>Urgency ${item.urgency}</span>
                    <span>Effort ${item.effort}</span>
                    <span>Age ${item.age}</span>
                    ${item.skipped > 0 ? `<span class="skipped">Skipped ${item.skipped}</span>` : ""}
                </div>
            </div>

            <div class="signals">
                <div>Score: ${score(item)}</div>
                <div>Status: Active</div>
            </div>

            <div class="progress-wrap">
                ${item.progress}%
                <div class="progress">
                    <div class="progress-bar" style="width:${item.progress}%"></div>
                </div>
            </div>

            <div class="why">
                (${item.impact}×2 + ${item.urgency}×2 + ${item.age}) - ${item.effort}
            </div>

            <div class="expanded">
                Expanded details: DevOps links, assignments, decision history.
            </div>
        `;

        div.addEventListener("click", ()=>{
            const expanded = div.querySelector(".expanded");
            expanded.style.display = expanded.style.display === "block" ? "none" : "block";
        });

        if(showWhy){
            div.querySelector(".why").style.display = "block";
        }

        addDragHandlers(div);
        list.appendChild(div);
    });
}

function addDragHandlers(card){
    card.addEventListener("dragstart", ()=>{
        card.classList.add("dragging");
    });

    card.addEventListener("dragend", ()=>{
        card.classList.remove("dragging");
        updateOrder();
    });
}

document.getElementById("list").addEventListener("dragover", e=>{
    e.preventDefault();
    const dragging = document.querySelector(".dragging");
    const after = getDragAfterElement(e.clientY);
    const list = document.getElementById("list");

    if(after == null){
        list.appendChild(dragging);
    } else {
        list.insertBefore(dragging, after);
    }
});

function getDragAfterElement(y){
    const elements = [...document.querySelectorAll(".card:not(.dragging)")];

    return elements.reduce((closest, child)=>{
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height/2;
        if(offset < 0 && offset > closest.offset){
            return {offset: offset, element: child};
        } else {
            return closest;
        }
    }, {offset: Number.NEGATIVE_INFINITY}).element;
}

function updateOrder(){
    const cards = [...document.querySelectorAll(".card")];
    cards.forEach((card, index)=>{
        const item = data.find(i => i.id == card.dataset.id);
        if(index !== data.indexOf(item)){
            item.skipped++;
        }
    });
    render();
}

document.getElementById("toggleWhy").onclick = ()=>{
    showWhy = !showWhy;
    document.getElementById("toggleWhy").classList.toggle("active");
    render();
};

render();
</script>

</body>
</html>
