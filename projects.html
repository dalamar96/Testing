<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Command Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 14px;
}

/* CARD */
.card {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
}

/* HEADER */
.title {
    font-size: 16px;
    font-weight: 700;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

/* STATUS */
.status {
    font-size: 12px;
    font-weight: 600;
}
.green { color: #4ade80; }
.yellow { color: #facc15; }
.red { color: #f87171; }

/* HEADER GRID */
.top {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.panel {
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px;
}

.panel h4 {
    margin: 0 0 6px 0;
    font-size: 12px;
    color: #94a3b8;
}

/* TRIAGE TAGS */
.tag {
    display: inline-block;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 11px;
    background: #1e293b;
    margin: 2px;
}

/* WORK GRID */
.work-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 12px;
}

.work {
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px;
}

.work h5 {
    margin: 0 0 8px 0;
    font-size: 12px;
    color: #94a3b8;
}

/* STATUS ROWS */
.row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin: 2px 0;
}

/* ASSIGNEES */
.people {
    font-size: 11px;
    color: #cbd5e1;
}

.person {
    display: inline-block;
    margin: 2px;
    padding: 2px 6px;
    border-radius: 6px;
    background: #1e293b;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Project Command Dashboard</h1>
    <div class="meta">ADO + Triage + Ownership View</div>
</div>

<div class="container" id="app"></div>

<script>

const projects = [
{
    name: "Checkout Platform",
    status: "Healthy",
    color: "green",
    created: "2025-11-01",
    updated: "2026-04-18",

    triage: {
        priority: "P1",
        urgency: "High",
        effort: "Large",
        risk: "Medium"
    },

    ado: {
        Epics: { new: 2, progress: 3, done: 5 },
        Features: { new: 4, progress: 3, done: 5 },
        Bugs: { new: 3, progress: 6, done: 3 },
        Tasks: { new: 5, progress: 6, done: 3 }
    },

    owners: {
        dev: ["Alex", "Morgan"],
        dba: ["Sam"],
        ba: ["Jordan", "Casey"],
        tester: ["Riley"]
    }
},

{
    name: "Analytics Portal",
    status: "At Risk",
    color: "yellow",
    created: "2025-12-15",
    updated: "2026-04-17",

    triage: {
        priority: "P2",
        urgency: "Medium",
        effort: "Large",
        risk: "High"
    },

    ado: {
        Epics: { new: 1, progress: 4, done: 2 },
        Features: { new: 6, progress: 5, done: 5 },
        Bugs: { new: 2, progress: 3, done: 2 },
        Tasks: { new: 3, progress: 4, done: 3 }
    },

    owners: {
        dev: ["Taylor", "Jamie"],
        dba: ["Sam"],
        ba: ["Morgan"],
        tester: ["Riley", "Casey"]
    }
}
];

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach(p=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="title">${p.name}</div>
            <div class="meta">
                Created: ${p.created} | Updated: ${p.updated}
            </div>

            <div class="status ${p.color}">
                Status: ${p.status}
            </div>

            <!-- TRIAGE MOVED INTO HEADER -->
            <div class="top">

                <div class="panel">
                    <h4>Triage</h4>
                    <div class="tag">Priority: ${p.triage.priority}</div>
                    <div class="tag">Urgency: ${p.triage.urgency}</div>
                    <div class="tag">Effort: ${p.triage.effort}</div>
                    <div class="tag">Risk: ${p.triage.risk}</div>
                </div>

                <div class="panel">
                    <h4>Assigned Roles</h4>

                    <div><strong>Dev:</strong>
                        ${p.owners.dev.map(x=>`<span class="person">${x}</span>`).join("")}
                    </div>

                    <div><strong>DBA:</strong>
                        ${p.owners.dba.map(x=>`<span class="person">${x}</span>`).join("")}
                    </div>

                    <div><strong>BA:</strong>
                        ${p.owners.ba.map(x=>`<span class="person">${x}</span>`).join("")}
                    </div>

                    <div><strong>Tester:</strong>
                        ${p.owners.tester.map(x=>`<span class="person">${x}</span>`).join("")}
                    </div>
                </div>

            </div>

            <!-- WORK ITEMS -->
            <div class="work-grid">

                ${renderWork("Epics", p.ado.Epics)}
                ${renderWork("Features", p.ado.Features)}
                ${renderWork("Bugs", p.ado.Bugs)}
                ${renderWork("Tasks", p.ado.Tasks)}

            </div>
        `;

        app.appendChild(div);
    });
}

function renderWork(title, data){
    return `
    <div class="work">
        <h5>${title}</h5>

        <div class="row"><span>New</span><span>${data.new}</span></div>
        <div class="row"><span>In Progress</span><span>${data.progress}</span></div>
        <div class="row"><span>Done</span><span>${data.done}</span></div>
    </div>
    `;
}

render();

</script>

</body>
</html>
