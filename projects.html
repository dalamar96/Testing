<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Projects Portfolio</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#020617;
  --panel2:#0f172a;
  --border:#1e293b;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --green:#4ade80;
  --yellow:#facc15;
  --red:#f87171;
  --blue:#60a5fa;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:30;
  background:var(--panel);
}

.header h2{
  margin:0;
  font-size:18px;
}

.container{
  display:grid;
  grid-template-columns:minmax(0, 1fr) 400px;
  gap:12px;
  padding:12px;
  max-width:1500px;
  margin:auto;
}

.table-wrap{
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--panel);
  min-width:0;
}

.table-scroll{
  max-height:calc(100vh - 100px);
  overflow:auto;
}

/* IMPORTANT: header and rows share EXACTLY the same columns */
.grid-header,
.row{
  display:grid;
  grid-template-columns: minmax(240px, 2.2fr) 110px 90px 100px 100px 110px;
  gap:12px;
  align-items:center;
}

/* IMPORTANT: keep header in same scroll area */
.grid-header{
  position:sticky;
  top:0;
  z-index:5;
  background:#0f172a;
  border-bottom:1px solid var(--border);
  padding:10px 12px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
}

/* IMPORTANT: min-width:0 lets content shrink instead of breaking alignment */
.grid-header > div,
.row > div{
  min-width:0;
}

.row{
  padding:12px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.row:hover{
  background:#111c31;
}

.row.selected{
  background:#16233f;
}

.project-cell{
  min-width:0;
}

.project-name{
  font-weight:700;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.project-meta{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cell-text{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
}

.status-Healthy{ color:var(--green); }
.status-AtRisk{ color:var(--yellow); }
.status-Blocked{ color:var(--red); }

.pill{
  display:inline-block;
  padding:3px 8px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel2);
  font-size:11px;
  white-space:nowrap;
}

.progress-wrap{
  min-width:0;
}

.percent{
  font-size:11px;
  color:var(--muted);
  margin-bottom:4px;
}

.bar{
  height:8px;
  background:#1e293b;
  border-radius:999px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:var(--green);
}

.drawer{
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  padding:12px;
  min-height:300px;
}

.drawer h3{
  margin-top:0;
}

.note{
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}

@media (max-width: 1100px){
  .container{
    grid-template-columns:1fr;
  }

  .drawer{
    order:-1;
  }
}
</style>
</head>
<body>

<div class="header">
  <h2>Project Portfolio</h2>
</div>

<div class="container">
  <div class="table-wrap">
    <div class="table-scroll">
      <div class="grid-header">
        <div>Project</div>
        <div>Status</div>
        <div>Priority</div>
        <div>Urgency</div>
        <div>Updated</div>
        <div>Done %</div>
      </div>

      <div id="rows"></div>
    </div>
  </div>

  <div class="drawer" id="drawer">
    Select a project
  </div>
</div>

<script>
const projects = [
  {
    id:1,
    name:"Claims Modernization Platform",
    domain:"Claims / Core",
    status:"At Risk",
    priority:"P1",
    urgency:"High",
    updated:"2026-04-20",
    metrics:{ total:2143, done:1458, active:312, blocked:41 },
    notes:[
      { dt:"2026-04-20 14:52", text:"Scope split into phases." },
      { dt:"2026-04-18 09:22", text:"DB changes blocking progress." }
    ]
  },
  {
    id:2,
    name:"Customer Portal Refresh",
    domain:"Customer Experience",
    status:"Healthy",
    priority:"P2",
    urgency:"Medium",
    updated:"2026-04-21",
    metrics:{ total:284, done:228, active:39, blocked:4 },
    notes:[
      { dt:"2026-04-21 08:11", text:"Feature finalized." },
      { dt:"2026-04-20 15:44", text:"Bug fix deployed." }
    ]
  },
  {
    id:3,
    name:"Payments Reliability and Gateway Retry Stabilization Workstream",
    domain:"Checkout",
    status:"Blocked",
    priority:"P1",
    urgency:"High",
    updated:"2026-04-19",
    metrics:{ total:97, done:67, active:21, blocked:9 },
    notes:[
      { dt:"2026-04-19 17:03", text:"Gateway issue." },
      { dt:"2026-04-18 11:14", text:"Retry logic failure." }
    ]
  }
];

for(let i=4;i<=30;i++){
  const total = Math.floor(Math.random()*500)+50;
  const done = Math.floor(total * (0.45 + Math.random()*0.45));
  projects.push({
    id:i,
    name:"Project " + i + (i % 5 === 0 ? " With A Much Longer Name To Test Alignment" : ""),
    domain:["Finance","Claims","Security","Mobile","BI / Data"][Math.floor(Math.random()*5)],
    status:["Healthy","At Risk","Blocked"][Math.floor(Math.random()*3)],
    priority:["P1","P2","P3"][Math.floor(Math.random()*3)],
    urgency:["High","Medium","Low"][Math.floor(Math.random()*3)],
    updated:"2026-04-" + String(10 + Math.floor(Math.random()*12)).padStart(2,"0"),
    metrics:{
      total,
      done,
      active:Math.floor(Math.random()*100),
      blocked:Math.floor(Math.random()*20)
    },
    notes:[
      { dt:"2026-04-18 10:00", text:"Update made." },
      { dt:"2026-04-15 09:30", text:"Reviewed." }
    ]
  });
}

let selected = null;

function statusClass(status){
  if(status === "Healthy") return "status-Healthy";
  if(status === "At Risk") return "status-AtRisk";
  return "status-Blocked";
}

function render(){
  const rows = document.getElementById("rows");
  rows.innerHTML = "";

  projects.forEach(p => {
    const row = document.createElement("div");
    row.className = "row" + (selected === p.id ? " selected" : "");
    const percent = Math.round((p.metrics.done / p.metrics.total) * 100);

    row.innerHTML = `
      <div class="project-cell">
        <div class="project-name">${p.name}</div>
        <div class="project-meta">${p.domain}</div>
      </div>

      <div class="cell-text ${statusClass(p.status)}">${p.status}</div>
      <div class="cell-text">${p.priority}</div>
      <div class="cell-text">${p.urgency}</div>
      <div class="cell-text">${p.updated}</div>

      <div class="progress-wrap">
        <div class="percent">${percent}%</div>
        <div class="bar">
          <div class="fill" style="width:${percent}%"></div>
        </div>
      </div>
    `;

    row.onclick = () => {
      selected = p.id;
      render();
      showDetails(p);
    };

    rows.appendChild(row);
  });
}

function showDetails(p){
  const d = document.getElementById("drawer");
  d.innerHTML = `
    <h3>${p.name}</h3>
    <p><strong>Status:</strong> ${p.status}</p>
    <p><strong>Priority:</strong> ${p.priority}</p>
    <p><strong>Urgency:</strong> ${p.urgency}</p>
    <p><strong>Updated:</strong> ${p.updated}</p>

    <h4>Metrics</h4>
    <p>Total: ${p.metrics.total}</p>
    <p>Done: ${p.metrics.done}</p>
    <p>Active: ${p.metrics.active}</p>
    <p>Blocked: ${p.metrics.blocked}</p>

    <h4>Notes</h4>
    ${p.notes.map(n => `<div class="note">${n.dt} - ${n.text}</div>`).join("")}
  `;
}

render();
</script>

</body>
</html>
