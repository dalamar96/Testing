<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Flight Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 14px;
}

/* CARD */
.card {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    cursor: pointer;
}

.title {
    font-size: 16px;
    font-weight: 700;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

/* TRIAGE */
.triage {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.tag {
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 6px;
    background: #1e293b;
}

/* WORK GRID */
.work-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 12px;
}

.work {
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px;
}

.bar {
    height: 8px;
    background: #1e293b;
    border-radius: 6px;
    overflow: hidden;
}

.fill {
    height: 100%;
    background: #4ade80;
}

/* NOTES PANEL */
.notes {
    margin-top: 12px;
    border-top: 1px solid #1e293b;
    padding-top: 10px;
    display: none;
}

.note {
    padding: 8px;
    border-bottom: 1px solid #1e293b;
    font-size: 12px;
}

.note-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
}

.note-type {
    font-weight: bold;
    font-size: 11px;
    color: #60a5fa;
}

.note a {
    color: #93c5fd;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    <h1>Project Flight Deck</h1>
</div>

<div class="container" id="app"></div>

<script>

const projects = [
{
    name: "Checkout Platform",
    created: "2025-11-01",
    updated: "2026-04-18",

    triage: {
        priority: "P1",
        urgency: "High",
        effort: "Large",
        risk: "Medium"
    },

    ado: {
        Epics: { done: 5, total: 7 },
        Features: { done: 5, total: 12 },
        Bugs: { done: 3, total: 12 },
        Tasks: { done: 3, total: 14 }
    },

    notes: [
        {
            date: "2026-04-18 14:32",
            type: "Bug",
            title: "Retry Logic Failure",
            link: "#",
            text: "Fix deployed, monitoring for recurrence"
        },
        {
            date: "2026-04-17 09:12",
            type: "Feature",
            title: "Payment Retry Enhancement",
            link: "#",
            text: "Feature completed and merged"
        },
        {
            date: "2026-04-15 16:45",
            type: "Epic",
            title: "Checkout Stability Initiative",
            link: "#",
            text: "QA backlog identified"
        }
    ]
}
];

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach((p, i)=>{
        const div = document.createElement("div");
        div.className = "card";
        div.onclick = () => toggleNotes(i);

        div.innerHTML = `
            <div class="title">${p.name}</div>
            <div class="meta">
                Created: ${p.created} | Updated: ${p.updated}
            </div>

            <div class="triage">
                <span class="tag">P: ${p.triage.priority}</span>
                <span class="tag">Urgency: ${p.triage.urgency}</span>
                <span class="tag">Effort: ${p.triage.effort}</span>
                <span class="tag">Risk: ${p.triage.risk}</span>
            </div>

            <div class="work-grid">
                ${work("Epics", p.ado.Epics)}
                ${work("Features", p.ado.Features)}
                ${work("Bugs", p.ado.Bugs)}
                ${work("Tasks", p.ado.Tasks)}
            </div>

            <div class="notes" id="notes-${i}">
                ${p.notes.map(n=>`
                    <div class="note">
                        <div class="note-header">
                            <span class="note-type">${n.type}</span>
                            <span>${n.date}</span>
                        </div>
                        <div>
                            <a href="${n.link}">${n.title}</a>
                        </div>
                        <div>${n.text}</div>
                    </div>
                `).join("")}
            </div>
        `;

        app.appendChild(div);
    });
}

function work(name, data){
    const percent = Math.round((data.done / data.total) * 100);
    return `
        <div class="work">
            <div>${name}</div>
            <div>${data.done}/${data.total}</div>
            <div class="bar">
                <div class="fill" style="width:${percent}%"></div>
            </div>
        </div>
    `;
}

function toggleNotes(i){
    const el = document.getElementById("notes-" + i);
    el.style.display = el.style.display === "block" ? "none" : "block";
}

render();

</script>

</body>
</html>
