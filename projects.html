<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Flow Dashboard</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 14px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

/* CARD */
.card {
    border: 1px solid #1e293b;
    background: #020617;
    border-radius: 10px;
    padding: 14px;
    min-height: 420px;
}

.title {
    font-size: 15px;
    font-weight: 600;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

/* STATUS */
.status.green { color: #4ade80; }
.status.yellow { color: #facc15; }
.status.red { color: #f87171; }

/* HORIZONTAL STRUCTURE */
.header-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
    font-size: 12px;
    color: #94a3b8;
}

/* FLOW ROWS */
.flow-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 6px;
}

/* CELL */
.cell {
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 8px;
    text-align: center;
}

/* STATUS COLORS (MEANINGFUL NOW) */
.new {
    background: rgba(59,130,246,0.15);
    color: #60a5fa;
}

.progress {
    background: rgba(250,204,21,0.12);
    color: #facc15;
}

.done {
    background: rgba(74,222,128,0.12);
    color: #4ade80;
}

.blocked {
    background: rgba(248,113,113,0.12);
    color: #f87171;
}

/* SECTION */
.section {
    border-top: 1px solid #1e293b;
    padding: 8px 0;
    cursor: pointer;
    font-size: 12px;
    color: #94a3b8;
}

.content {
    display: none;
    padding: 8px 0;
    font-size: 12px;
}

.note {
    border-left: 2px solid #3b82f6;
    padding-left: 8px;
    margin-bottom: 6px;
}

.timeline {
    border-left: 2px solid #1e293b;
    padding-left: 10px;
}

.event {
    margin-bottom: 6px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Project Flow Dashboard</h1>
    <div class="meta">Horizontal Work System View (ADO-style flow map)</div>
</div>

<div class="container">
    <div class="grid" id="app"></div>
</div>

<script>

const projects = [
{
    name: "Checkout Platform",
    status: "Healthy",
    color: "green",
    created: "2025-11-01",
    updated: "2026-04-18",

    flow: {
        Epics:    { new: 2, progress: 3, done: 5, blocked: 1 },
        Features: { new: 4, progress: 3, done: 5, blocked: 0 },
        Bugs:     { new: 3, progress: 6, done: 3, blocked: 2 },
        Tasks:    { new: 5, progress: 6, done: 3, blocked: 0 }
    },

    notes: [
        {date:"2026-04-10", text:"Revenue bug spike in retry flow"},
        {date:"2026-04-12", text:"Hotfix stabilized system"},
        {date:"2026-04-18", text:"QA backlog rising slightly"}
    ],

    timeline: [
        "2026-04-01 - Sprint started",
        "2026-04-05 - Incident detected",
        "2026-04-10 - Hotfix deployed",
        "2026-04-15 - QA bottleneck"
    ]
},

{
    name: "Analytics Portal",
    status: "At Risk",
    color: "yellow",
    created: "2025-12-15",
    updated: "2026-04-17",

    flow: {
        Epics:    { new: 1, progress: 4, done: 2, blocked: 0 },
        Features: { new: 6, progress: 5, done: 5, blocked: 1 },
        Bugs:     { new: 2, progress: 3, done: 2, blocked: 1 },
        Tasks:    { new: 3, progress: 4, done: 3, blocked: 0 }
    },

    notes: [
        {date:"2026-04-08", text:"QA slowdown began"},
        {date:"2026-04-12", text:"API refactor increasing load"},
        {date:"2026-04-17", text:"Risk escalated due to QA saturation"}
    ],

    timeline: [
        "2026-04-01 - Epic started",
        "2026-04-08 - QA slowdown",
        "2026-04-12 - Refactor begins",
        "2026-04-17 - Risk flagged"
    ]
}
];

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach(p=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="title">${p.name}</div>
            <div class="meta">Created: ${p.created} | Updated: ${p.updated}</div>

            <div class="status ${p.color}">
                Status: ${p.status}
            </div>

            <div class="header-row">
                <div>Epics</div>
                <div>Features</div>
                <div>Bugs</div>
                <div>Tasks</div>
            </div>

            ${renderRow(p.flow, "new")}
            ${renderRow(p.flow, "progress")}
            ${renderRow(p.flow, "done")}
            ${renderRow(p.flow, "blocked")}

            <div class="section" onclick="toggle(this)">
                📌 Notes (Chronological)
            </div>
            <div class="content">
                ${p.notes.map(n=>`
                    <div class="note">
                        <strong>${n.date}</strong><br/>
                        ${n.text}
                    </div>
                `).join("")}
            </div>

            <div class="section" onclick="toggle(this)">
                📈 Timeline
            </div>
            <div class="content timeline">
                ${p.timeline.map(t=>`
                    <div class="event">• ${t}</div>
                `).join("")}
            </div>
        `;

        app.appendChild(div);
    });
}

function renderRow(flow, key){
    return `
    <div class="flow-row">
        <div class="cell ${key}">${flow.Epics[key] ?? 0}</div>
        <div class="cell ${key}">${flow.Features[key] ?? 0}</div>
        <div class="cell ${key}">${flow.Bugs[key] ?? 0}</div>
        <div class="cell ${key}">${flow.Tasks[key] ?? 0}</div>
    </div>`;
}

function toggle(el){
    const content = el.nextElementSibling;
    content.style.display = content.style.display === "block" ? "none" : "block";
}

render();

</script>

</body>
</html>
