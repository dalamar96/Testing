<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Flight Deck Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
}

/* GRID */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 14px;
}

/* CARD */
.card {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
}

/* TOP HEADER */
.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.title {
    font-size: 16px;
    font-weight: 700;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

/* TRIAGE INLINE */
.triage {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: flex-end;
}

.tag {
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 6px;
    background: #1e293b;
    color: #cbd5e1;
}

/* STATUS */
.status.green { color: #4ade80; }
.status.yellow { color: #facc15; }
.status.red { color: #f87171; }

/* WORK GRID */
.work-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 12px;
}

.work {
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px;
}

.work h5 {
    margin: 0 0 8px 0;
    font-size: 12px;
    color: #94a3b8;
}

/* PROGRESS BAR */
.bar {
    width: 100%;
    height: 8px;
    background: #1e293b;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 6px;
}

.fill {
    height: 100%;
    background: #4ade80;
}

/* COLORS BY TYPE */
.epic { background: #60a5fa; }
.feature { background: #a78bfa; }
.bug { background: #f87171; }
.task { background: #facc15; }

/* LABEL ROW */
.row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Project Flight Deck</h1>
</div>

<div class="container" id="app"></div>

<script>

const projects = [
{
    name: "Checkout Platform",
    status: "Healthy",
    color: "green",
    created: "2025-11-01",
    updated: "2026-04-18",

    triage: {
        priority: "P1",
        urgency: "High",
        effort: "Large",
        risk: "Medium"
    },

    ado: {
        Epics: { done: 5, total: 7 },
        Features: { done: 5, total: 12 },
        Bugs: { done: 3, total: 12 },
        Tasks: { done: 3, total: 14 }
    }
},

{
    name: "Analytics Portal",
    status: "At Risk",
    color: "yellow",
    created: "2025-12-15",
    updated: "2026-04-17",

    triage: {
        priority: "P2",
        urgency: "Medium",
        effort: "Large",
        risk: "High"
    },

    ado: {
        Epics: { done: 2, total: 5 },
        Features: { done: 5, total: 16 },
        Bugs: { done: 2, total: 7 },
        Tasks: { done: 3, total: 10 }
    }
}
];

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach(p=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="top">

                <div>
                    <div class="title">${p.name}</div>
                    <div class="meta">
                        Created: ${p.created} | Updated: ${p.updated}
                    </div>
                    <div class="status ${p.color}">
                        Status: ${p.status}
                    </div>
                </div>

                <div class="triage">
                    <span class="tag">Priority ${p.triage.priority}</span>
                    <span class="tag">Urgency ${p.triage.urgency}</span>
                    <span class="tag">Effort ${p.triage.effort}</span>
                    <span class="tag">Risk ${p.triage.risk}</span>
                </div>

            </div>

            <div class="work-grid">

                ${workBlock("Epics", p.ado.Epics, "epic")}
                ${workBlock("Features", p.ado.Features, "feature")}
                ${workBlock("Bugs", p.ado.Bugs, "bug")}
                ${workBlock("Tasks", p.ado.Tasks, "task")}

            </div>
        `;

        app.appendChild(div);
    });
}

function workBlock(name, data, cls){
    const percent = Math.round((data.done / data.total) * 100);

    return `
    <div class="work">
        <h5>${name}</h5>

        <div class="row">
            <span>${data.done} / ${data.total}</span>
            <span>${percent}%</span>
        </div>

        <div class="bar">
            <div class="fill ${cls}" style="width:${percent}%"></div>
        </div>
    </div>
    `;
}

render();

</script>

</body>
</html>
