<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Overview Dashboard (Hierarchy Model)</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 14px;
}

.card {
    border: 1px solid #1e293b;
    background: #020617;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
}

.title {
    font-size: 15px;
    font-weight: 600;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

.status.green { color: #4ade80; }
.status.yellow { color: #facc15; }
.status.red { color: #f87171; }

/* HIERARCHY BLOCK */
.hierarchy {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
}

.block {
    background: #1e293b;
    border-radius: 8px;
    padding: 8px;
    font-size: 11px;
}

.block h4 {
    margin: 0 0 6px 0;
    font-size: 11px;
    color: #94a3b8;
}

/* STATUS ROWS */
.row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin: 2px 0;
}

.label {
    color: #cbd5f5;
}

/* ACCORDION */
.section {
    border-top: 1px solid #1e293b;
    padding: 8px 0;
    cursor: pointer;
    font-size: 12px;
    color: #94a3b8;
}

.content {
    display: none;
    padding: 8px 0;
    font-size: 12px;
}

.note {
    border-left: 2px solid #3b82f6;
    padding-left: 8px;
    margin-bottom: 6px;
}

.timeline {
    border-left: 2px solid #1e293b;
    padding-left: 10px;
}

.event {
    margin-bottom: 6px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Project Overview (ADO Hierarchy Model)</h1>
    <div class="meta">Epics → Features → Bugs → Tasks (Status Breakdown View)</div>
</div>

<div class="container" id="app"></div>

<script>

const projects = [
{
    id: 1,
    name: "Checkout Platform",
    status: "Healthy",
    color: "green",
    created: "2025-11-01",
    updated: "2026-04-18",

    hierarchy: {
        epics: { New: 2, "In Progress": 3, Done: 5 },
        features: { New: 4, "In Progress": 3, Done: 5 },
        bugs: { New: 3, "In Progress": 6, Done: 3 },
        tasks: { New: 5, "In Progress": 6, Done: 3 }
    },

    notes: [
        {date:"2026-04-10", text:"Revenue bug in retry flow caused spike"},
        {date:"2026-04-12", text:"Hotfix stabilized system"},
        {date:"2026-04-18", text:"QA backlog slightly growing"}
    ],

    timeline: [
        "2026-04-01 - Epic: Payment stability started",
        "2026-04-05 - Bug surge detected",
        "2026-04-10 - Emergency release",
        "2026-04-15 - QA bottleneck"
    ]
},

{
    id: 2,
    name: "Analytics Portal",
    status: "At Risk",
    color: "yellow",
    created: "2025-12-15",
    updated: "2026-04-17",

    hierarchy: {
        epics: { New: 1, "In Progress": 4, Done: 2 },
        features: { New: 6, "In Progress": 5, Done: 5 },
        bugs: { New: 2, "In Progress": 3, Done: 2 },
        tasks: { New: 3, "In Progress": 4, Done: 3 }
    },

    notes: [
        {date:"2026-04-08", text:"Performance regression in QA"},
        {date:"2026-04-12", text:"Aggregation delays increasing"},
        {date:"2026-04-17", text:"Risk flagged due to QA saturation"}
    ],

    timeline: [
        "2026-04-01 - Analytics epic started",
        "2026-04-08 - QA slowdown",
        "2026-04-12 - API refactor began",
        "2026-04-17 - Risk escalation"
    ]
},

{
    id: 3,
    name: "Core Authentication System",
    status: "Blocked",
    color: "red",
    created: "2025-10-10",
    updated: "2026-04-16",

    hierarchy: {
        epics: { New: 0, "In Progress": 2, Done: 3 },
        features: { New: 1, "In Progress": 1, Done: 2 },
        bugs: { New: 2, "In Progress": 5, Done: 2 },
        tasks: { New: 3, "In Progress": 4, Done: 4 }
    },

    notes: [
        {date:"2026-04-03", text:"DB schema dependency blocking progress"},
        {date:"2026-04-09", text:"Security audit expanded scope"},
        {date:"2026-04-16", text:"Still blocked on infra approval"}
    ],

    timeline: [
        "2026-03-28 - Auth epic started",
        "2026-04-03 - DB blocker introduced",
        "2026-04-09 - Security review expanded",
        "2026-04-16 - Blocked state persists"
    ]
}
];

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach(p=>{
        const div = document.createElement("div");
        div.className = "card";

        const h = p.hierarchy;

        div.innerHTML = `
            <div class="title">${p.name}</div>
            <div class="meta">
                Created: ${p.created} | Updated: ${p.updated}
            </div>

            <div class="status ${p.color}">
                Status: ${p.status}
            </div>

            <div class="hierarchy">

                <div class="block">
                    <h4>Epics</h4>
                    ${format(h.epics)}
                </div>

                <div class="block">
                    <h4>Features</h4>
                    ${format(h.features)}
                </div>

                <div class="block">
                    <h4>Bugs</h4>
                    ${format(h.bugs)}
                </div>

                <div class="block">
                    <h4>Tasks</h4>
                    ${format(h.tasks)}
                </div>

            </div>

            <div class="section" onclick="toggle(this)">
                📌 Notes (Chronological)
            </div>
            <div class="content">
                ${p.notes.map(n=>`
                    <div class="note">
                        <strong>${n.date}</strong><br/>
                        ${n.text}
                    </div>
                `).join("")}
            </div>

            <div class="section" onclick="toggle(this)">
                📈 Timeline (All Work Items)
            </div>
            <div class="content timeline">
                ${p.timeline.map(t=>`
                    <div class="event">• ${t}</div>
                `).join("")}
            </div>
        `;

        app.appendChild(div);
    });
}

function format(obj){
    return Object.entries(obj).map(([k,v])=>{
        return `<div class="row"><span class="label">${k}</span><span>${v}</span></div>`;
    }).join("");
}

function toggle(el){
    const content = el.nextElementSibling;
    content.style.display = content.style.display === "block" ? "none" : "block";
}

render();

</script>

</body>
</html>
