<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Overview Grid Dashboard</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 14px;
}

/* GRID LAYOUT (2 wide cards) */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

/* CARD */
.card {
    border: 1px solid #1e293b;
    background: #020617;
    border-radius: 10px;
    padding: 14px;
    min-height: 420px;
    display: flex;
    flex-direction: column;
}

.title {
    font-size: 15px;
    font-weight: 600;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

.status.green { color: #4ade80; }
.status.yellow { color: #facc15; }
.status.red { color: #f87171; }

/* HORIZONTAL WORK FLOW */
.flow {
    margin-top: 12px;
}

.flow-block {
    margin-bottom: 10px;
}

.flow-title {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 4px;
}

/* NEW HORIZONTAL BAR */
.bar {
    display: flex;
    height: 26px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #1e293b;
}

.seg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
}

.new { background: #3b82f6; width: 30%; }
.progress { background: #facc15; width: 40%; color: black; }
.done { background: #4ade80; width: 30%; }

/* NOTES + TIMELINE */
.section {
    border-top: 1px solid #1e293b;
    padding: 8px 0;
    cursor: pointer;
    font-size: 12px;
    color: #94a3b8;
}

.content {
    display: none;
    padding: 8px 0;
    font-size: 12px;
}

.note {
    border-left: 2px solid #3b82f6;
    padding-left: 8px;
    margin-bottom: 6px;
}

.timeline {
    border-left: 2px solid #1e293b;
    padding-left: 10px;
}

.event {
    margin-bottom: 6px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Project Overview Grid (Flow-Based View)</h1>
    <div class="meta">Epics / Features / Bugs / Tasks → Status Flow Visualization</div>
</div>

<div class="container">
    <div class="grid" id="app"></div>
</div>

<script>

const projects = [
{
    name: "Checkout Platform",
    status: "Healthy",
    color: "green",
    created: "2025-11-01",
    updated: "2026-04-18",

    flow: {
        Epics: { new: 2, progress: 3, done: 5 },
        Features: { new: 4, progress: 3, done: 5 },
        Bugs: { new: 3, progress: 6, done: 3 },
        Tasks: { new: 5, progress: 6, done: 3 }
    },

    notes: [
        {date:"2026-04-10", text:"Revenue bug spike in retry flow"},
        {date:"2026-04-12", text:"Hotfix stabilized system"},
        {date:"2026-04-18", text:"QA backlog rising slightly"}
    ],

    timeline: [
        "2026-04-01 - Sprint started",
        "2026-04-05 - Incident detected",
        "2026-04-10 - Hotfix deployed",
        "2026-04-15 - QA bottleneck"
    ]
},

{
    name: "Analytics Portal",
    status: "At Risk",
    color: "yellow",
    created: "2025-12-15",
    updated: "2026-04-17",

    flow: {
        Epics: { new: 1, progress: 4, done: 2 },
        Features: { new: 6, progress: 5, done: 5 },
        Bugs: { new: 2, progress: 3, done: 2 },
        Tasks: { new: 3, progress: 4, done: 3 }
    },

    notes: [
        {date:"2026-04-08", text:"QA slowdown began"},
        {date:"2026-04-12", text:"API refactor increasing load"},
        {date:"2026-04-17", text:"Risk escalated due to QA saturation"}
    ],

    timeline: [
        "2026-04-01 - Epic started",
        "2026-04-08 - QA slowdown",
        "2026-04-12 - Refactor begins",
        "2026-04-17 - Risk flagged"
    ]
},

{
    name: "Core Authentication System",
    status: "Blocked",
    color: "red",
    created: "2025-10-10",
    updated: "2026-04-16",

    flow: {
        Epics: { new: 0, progress: 2, done: 3 },
        Features: { new: 1, progress: 1, done: 2 },
        Bugs: { new: 2, progress: 5, done: 2 },
        Tasks: { new: 3, progress: 4, done: 4 }
    },

    notes: [
        {date:"2026-04-03", text:"DB schema blocking progress"},
        {date:"2026-04-09", text:"Security audit expanded"},
        {date:"2026-04-16", text:"Still blocked on infra approval"}
    ],

    timeline: [
        "2026-03-28 - Epic started",
        "2026-04-03 - DB blocker",
        "2026-04-09 - Security expansion",
        "2026-04-16 - Blocked state"
    ]
}
];

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach(p=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="title">${p.name}</div>
            <div class="meta">Created: ${p.created} | Updated: ${p.updated}</div>

            <div class="status ${p.color}">
                Status: ${p.status}
            </div>

            <div class="flow">

                ${Object.entries(p.flow).map(([type,data])=>`
                    <div class="flow-block">
                        <div class="flow-title">${type}</div>

                        <div class="bar">
                            <div class="seg new">
                                ${data.new}
                            </div>
                            <div class="seg progress">
                                ${data.progress}
                            </div>
                            <div class="seg done">
                                ${data.done}
                            </div>
                        </div>
                    </div>
                `).join("")}

            </div>

            <div class="section" onclick="toggle(this)">
                📌 Notes (Chronological)
            </div>
            <div class="content">
                ${p.notes.map(n=>`
                    <div class="note">
                        <strong>${n.date}</strong><br/>
                        ${n.text}
                    </div>
                `).join("")}
            </div>

            <div class="section" onclick="toggle(this)">
                📈 Timeline
            </div>
            <div class="content timeline">
                ${p.timeline.map(t=>`
                    <div class="event">• ${t}</div>
                `).join("")}
            </div>
        `;

        app.appendChild(div);
    });
}

function toggle(el){
    const content = el.nextElementSibling;
    content.style.display = content.style.display === "block" ? "none" : "block";
}

render();

</script>

</body>
</html>
