<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Briefing Dashboard</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 14px;
}

/* CARD */
.card {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
}

/* HEADER */
.title {
    font-size: 16px;
    font-weight: 700;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

/* STATUS */
.status {
    font-size: 12px;
    font-weight: bold;
}
.green { color: #4ade80; }
.yellow { color: #facc15; }
.red { color: #f87171; }

/* GRID SECTIONS */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.block {
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px;
}

.block h4 {
    margin: 0 0 6px 0;
    font-size: 12px;
    color: #94a3b8;
}

/* TAGS */
.tag {
    display: inline-block;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 11px;
    background: #1e293b;
    margin: 2px;
}

/* TRIAGE METRICS */
.metrics {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
}

.metric {
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 6px;
    background: #1e293b;
}

/* PRIORITY COLORS */
.p1 { border-left: 3px solid #ef4444; }
.p2 { border-left: 3px solid #f59e0b; }
.p3 { border-left: 3px solid #3b82f6; }
</style>
</head>

<body>

<div class="header">
    <h1>Project Briefing Dashboard</h1>
    <div class="meta">ADO + Triage Intelligence View</div>
</div>

<div class="container" id="app"></div>

<script>

const projects = [
{
    name: "Checkout Platform",
    status: "Healthy",
    color: "green",

    ado: {
        epics: 5,
        features: 12,
        bugs: 24,
        tasks: 18
    },

    triage: {
        priority: "P1",
        urgency: "High",
        effort: "Large",
        risk: "Medium"
    },

    roles: {
        dev: 3,
        dba: 1,
        ba: 2,
        tester: 2
    },

    attention: [
        "QA queue growing",
        "One critical bug in retry flow",
        "Performance spike under load"
    ],

    created: "2025-11-01",
    updated: "2026-04-18"
},

{
    name: "Analytics Portal",
    status: "At Risk",
    color: "yellow",

    ado: {
        epics: 3,
        features: 16,
        bugs: 10,
        tasks: 12
    },

    triage: {
        priority: "P2",
        urgency: "Medium",
        effort: "Large",
        risk: "High"
    },

    roles: {
        dev: 4,
        dba: 1,
        ba: 2,
        tester: 3
    },

    attention: [
        "QA bottleneck forming",
        "Performance regression in dashboard",
        "API latency increasing"
    ],

    created: "2025-12-15",
    updated: "2026-04-17"
},

{
    name: "Core Authentication System",
    status: "Blocked",
    color: "red",

    ado: {
        epics: 2,
        features: 4,
        bugs: 11,
        tasks: 9
    },

    triage: {
        priority: "P1",
        urgency: "Critical",
        effort: "Large",
        risk: "High"
    },

    roles: {
        dev: 2,
        dba: 2,
        ba: 1,
        tester: 1
    },

    attention: [
        "DB schema blocking all progress",
        "Security review pending",
        "No movement in 6 days"
    ],

    created: "2025-10-10",
    updated: "2026-04-16"
}
];

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach(p=>{
        const div = document.createElement("div");
        div.className = `card p${p.triage.priority.slice(1)}`;

        div.innerHTML = `
            <div class="title">${p.name}</div>
            <div class="meta">
                Created: ${p.created} | Updated: ${p.updated}
            </div>

            <div class="status ${p.color}">
                Status: ${p.status}
            </div>

            <div class="grid">

                <div class="block">
                    <h4>ADO Work Breakdown</h4>
                    <div>Epics: ${p.ado.epics}</div>
                    <div>Features: ${p.ado.features}</div>
                    <div>Bugs: ${p.ado.bugs}</div>
                    <div>Tasks: ${p.ado.tasks}</div>
                </div>

                <div class="block">
                    <h4>Triage</h4>
                    <div class="metrics">
                        <div class="metric">Priority: ${p.triage.priority}</div>
                        <div class="metric">Urgency: ${p.triage.urgency}</div>
                        <div class="metric">Effort: ${p.triage.effort}</div>
                        <div class="metric">Risk: ${p.triage.risk}</div>
                    </div>
                </div>

                <div class="block">
                    <h4>Assigned Roles</h4>
                    <div>Dev: ${p.roles.dev}</div>
                    <div>DBA: ${p.roles.dba}</div>
                    <div>BA: ${p.roles.ba}</div>
                    <div>Tester: ${p.roles.tester}</div>
                </div>

                <div class="block">
                    <h4>Attention Needed</h4>
                    ${p.attention.map(a=>`<div class="tag">${a}</div>`).join("")}
                </div>

            </div>
        `;

        app.appendChild(div);
    });
}

render();

</script>

</body>
</html>
