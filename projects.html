<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Overview Dashboard (Full POC)</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 18px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.header h1 {
    margin: 0;
    font-size: 16px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 14px;
}

/* CARD */
.card {
    border: 1px solid #1e293b;
    background: #020617;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
}

.title {
    font-size: 15px;
    font-weight: 600;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 10px;
}

/* STATUS */
.status {
    font-size: 12px;
    font-weight: bold;
}

.green { color: #4ade80; }
.yellow { color: #facc15; }
.red { color: #f87171; }

/* KPI ROW */
.kpis {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0;
}

.kpi {
    background: #1e293b;
    padding: 4px 6px;
    border-radius: 6px;
    font-size: 11px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    font-size: 11px;
}

/* ACCORDION */
.section {
    border-top: 1px solid #1e293b;
    padding: 8px 0;
    cursor: pointer;
    font-size: 12px;
    color: #94a3b8;
}

.content {
    display: none;
    padding: 8px 0;
    font-size: 12px;
}

/* NOTES */
.note {
    border-left: 2px solid #3b82f6;
    padding-left: 8px;
    margin-bottom: 6px;
}

/* TIMELINE */
.timeline {
    border-left: 2px solid #1e293b;
    padding-left: 10px;
}

.event {
    margin-bottom: 6px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Project Overview Dashboard</h1>
    <div class="meta">ADO Portfolio Intelligence View</div>
</div>

<div class="container" id="app"></div>

<script>

    workItems: { Bug: 9, Feature: 4, Task: 11 },
    stateCounts: { "In Progress": 3, "QA": 2, "Blocked": 8, "Done": 11 },
    notes: [
        {date:"2026-04-03", text:"DB schema dependency delaying progress"},
        {date:"2026-04-09", text:"Security review expanded scope"},
        {date:"2026-04-16", text:"Still blocked on infrastructure approval"}
    ],

    ]

function render(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    projects.forEach(p=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="title">${p.name}</div>
            <div class="meta">
                Created: ${p.created} | Updated: ${p.updated}
            </div>

            <div class="status ${p.stateColor}">
                Status: ${p.status}
            </div>

            <div class="kpis">
                <div class="kpi">Bugs: ${p.workItems.Bug}</div>
                <div class="kpi">Features: ${p.workItems.Feature}</div>
                <div class="kpi">Tasks: ${p.workItems.Task}</div>
            </div>

            <div class="grid">
                <div>In Progress: ${p.stateCounts["In Progress"]}</div>
                <div>QA: ${p.stateCounts["QA"]}</div>
                <div>Blocked: ${p.stateCounts["Blocked"]}</div>
            </div>

            <div class="section" onclick="toggle(this)">
                📌 Notes (Chronological)
            </div>
            <div class="content">
                ${p.notes.map(n=>`
                    <div class="note">
                        <strong>${n.date}</strong><br/>
                        ${n.text}
                    </div>
                `).join("")}
            </div>

            <div class="section" onclick="toggle(this)">
                📈 Timeline (All Work Items)
            </div>
            <div class="content timeline">
                ${p.timeline.map(t=>`
                    <div class="event">• ${t}</div>
                `).join("")}
            </div>
        `;

        app.appendChild(div);
    });
}

function toggle(el){
    const content = el.nextElementSibling;
    content.style.display = content.style.display === "block" ? "none" : "block";
}

render();

</script>

</body>
</html>
