<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Triage Workbench - Notes Enabled</title>

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.header {
    padding: 14px 20px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    padding: 16px;
}

.card {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.title {
    font-weight: 600;
    font-size: 15px;
}

.meta {
    font-size: 12px;
    color: #94a3b8;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

input, select, textarea {
    width: 100%;
    padding: 6px;
    background: #020617;
    border: 1px solid #1e293b;
    color: #e2e8f0;
    border-radius: 6px;
    font-size: 12px;
}

textarea {
    min-height: 60px;
    resize: vertical;
}

/* QUICK NOTES */
.quick-notes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.quick-notes button {
    background: #1e293b;
    border: none;
    color: #cbd5f5;
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 6px;
    cursor: pointer;
}

/* ACTIONS */
.actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.approve { background: #16a34a; }
.defer { background: #eab308; }
.reject { background: #dc2626; color: white;}
.clarify { background: #2563eb; }

/* STATUS */
.status {
    font-size: 12px;
    font-weight: bold;
}

.status.Approved { color: #4ade80; }
.status.Deferred { color: #facc15; }
.status.Rejected { color: #f87171; }
.status.NeedsClarification { color: #60a5fa; }

/* NOTE INDICATOR */
.note-indicator {
    font-size: 11px;
    color: #38bdf8;
}
</style>
</head>

<body>

<div class="header">
    <h1>Triage Workbench</h1>
</div>

<div id="container" class="container"></div>

<script>
const data = [
    {id:1, title:"Fix payment bug", desc:"Users cannot complete payment.", app:"Checkout", type:"Bug", urgency:6, impact:9, effort:3, status:"Pending", notes:""},
    {id:2, title:"New dashboard", desc:"Need reporting tools.", app:"Portal", type:"Feature", urgency:5, impact:8, effort:5, status:"Pending", notes:""},
    {id:3, title:"Refactor auth", desc:"Improve login system.", app:"Core", type:"Initiative", urgency:4, impact:7, effort:8, status:"Pending", notes:""}
];

function render(){
    const container = document.getElementById("container");
    container.innerHTML = "";

    data.forEach(item=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="title">${item.title}</div>
            <div class="meta">${item.desc}</div>

            ${item.notes ? `<div class="note-indicator">📝 Notes added</div>` : ""}

            <div class="row">
                <div>
                    <label>App</label>
                    <input value="${item.app}" onchange="update(${item.id}, 'app', this.value)" />
                </div>
                <div>
                    <label>Type</label>
                    <select onchange="update(${item.id}, 'type', this.value)">
                        <option ${item.type==="Bug"?"selected":""}>Bug</option>
                        <option ${item.type==="Feature"?"selected":""}>Feature</option>
                        <option ${item.type==="Enhancement"?"selected":""}>Enhancement</option>
                        <option ${item.type==="Initiative"?"selected":""}>Initiative</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Urgency</label>
                    <select onchange="update(${item.id}, 'urgency', this.value)">
                        <option value="3" ${item.urgency==3?"selected":""}>Low</option>
                        <option value="6" ${item.urgency==6?"selected":""}>Medium</option>
                        <option value="9" ${item.urgency==9?"selected":""}>High</option>
                    </select>
                </div>
                <div>
                    <label>Impact</label>
                    <select onchange="update(${item.id}, 'impact', this.value)">
                        <option value="3" ${item.impact==3?"selected":""}>Low</option>
                        <option value="6" ${item.impact==6?"selected":""}>Medium</option>
                        <option value="9" ${item.impact==9?"selected":""}>High</option>
                    </select>
                </div>
            </div>

            <div>
                <label>Effort (Sprints)</label>
                <input type="number" value="${item.effort}" onchange="update(${item.id}, 'effort', this.value)" />
            </div>

            <div>
                <label>Notes</label>
                <textarea onchange="update(${item.id}, 'notes', this.value)">${item.notes}</textarea>
            </div>

            <div class="quick-notes">
                <button onclick="quickNote(${item.id}, 'Needs more detail')">Needs Detail</button>
                <button onclick="quickNote(${item.id}, 'Duplicate request')">Duplicate</button>
                <button onclick="quickNote(${item.id}, 'High business impact')">High Impact</button>
                <button onclick="quickNote(${item.id}, 'Large effort, split later')">Split Later</button>
            </div>

            <div class="actions">
                <button class="approve" onclick="decide(${item.id}, 'Approved')">Approve</button>
                <button class="defer" onclick="decide(${item.id}, 'Deferred')">Defer</button>
                <button class="reject" onclick="decide(${item.id}, 'Rejected')">Reject</button>
                <button class="clarify" onclick="decide(${item.id}, 'NeedsClarification')">Clarify</button>
            </div>

            <div class="status ${item.status}">
                Status: ${item.status}
            </div>
        `;

        container.appendChild(div);
    });
}

function update(id, field, value){
    const item = data.find(i=>i.id===id);
    item[field] = value;
}

function quickNote(id, text){
    const item = data.find(i=>i.id===id);
    item.notes = item.notes ? item.notes + " | " + text : text;
    render();
}

function decide(id, decision){
    const item = data.find(i=>i.id===id);
    item.status = decision;
    render();
}

render();
</script>

</body>
</html>
