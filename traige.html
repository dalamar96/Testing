<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Triage Meeting POC</title>

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

/* HEADER */
.header {
    padding: 14px 20px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
}

.header h1 {
    margin: 0;
    font-size: 18px;
}

/* LAYOUT */
.container {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: calc(100vh - 50px);
}

/* LEFT LIST */
.list {
    border-right: 1px solid #1e293b;
    overflow-y: auto;
}

.item {
    padding: 12px;
    border-bottom: 1px solid #1e293b;
    cursor: pointer;
}

.item:hover {
    background: #1e293b;
}

.item.active {
    background: #2563eb;
}

.item small {
    color: #94a3b8;
}

/* MAIN PANEL */
.main {
    padding: 20px;
    overflow-y: auto;
}

.title {
    font-size: 20px;
    margin-bottom: 10px;
}

.meta {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 15px;
}

.section {
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    min-height: 80px;
    background: #020617;
    border: 1px solid #1e293b;
    color: white;
    padding: 8px;
    border-radius: 6px;
}

/* BUTTONS */
.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.approve { background: #16a34a; }
.defer { background: #eab308; }
.reject { background: #dc2626; }
.clarify { background: #2563eb; }

.next {
    margin-left: auto;
    background: #1e293b;
}

/* DECISION LOG */
.log {
    margin-top: 20px;
    font-size: 12px;
    color: #cbd5f5;
}

.log-entry {
    border-top: 1px solid #1e293b;
    padding-top: 6px;
    margin-top: 6px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Triage Meeting</h1>
    <div id="counter"></div>
</div>

<div class="container">

    <!-- LEFT PANEL -->
    <div class="list" id="list"></div>

    <!-- RIGHT PANEL -->
    <div class="main">
        <div id="details"></div>
    </div>

</div>

<script>
const data = [
    {id:1, title:"Fix payment bug", app:"Checkout", type:"Bug", desc:"Users cannot complete payment.", status:"Pending"},
    {id:2, title:"New reporting dashboard", app:"Portal", type:"Feature", desc:"Need analytics for users.", status:"Pending"},
    {id:3, title:"Refactor login system", app:"Core", type:"Initiative", desc:"Improve security and scalability.", status:"Pending"}
];

let currentIndex = 0;
let decisions = [];

function renderList(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach((item, index)=>{
        const div = document.createElement("div");
        div.className = "item" + (index === currentIndex ? " active" : "");
        div.innerHTML = `
            <strong>${item.title}</strong><br/>
            <small>${item.app} • ${item.type}</small>
        `;
        div.onclick = ()=>{
            currentIndex = index;
            render();
        };
        list.appendChild(div);
    });

    document.getElementById("counter").innerText =
        `${currentIndex+1} / ${data.length}`;
}

function renderDetails(){
    const item = data[currentIndex];
    const container = document.getElementById("details");

    container.innerHTML = `
        <div class="title">${item.title}</div>
        <div class="meta">${item.app} • ${item.type}</div>

        <div class="section">
            <strong>Description</strong>
            <p>${item.desc}</p>
        </div>

        <div class="section">
            <strong>Decision Notes</strong>
            <textarea id="notes" placeholder="Why are we making this decision?"></textarea>
        </div>

        <div class="actions">
            <button class="approve" onclick="decide('Approved')">Approve</button>
            <button class="defer" onclick="decide('Deferred')">Defer</button>
            <button class="reject" onclick="decide('Rejected')">Reject</button>
            <button class="clarify" onclick="decide('Needs Clarification')">Clarify</button>
            <button class="next" onclick="nextItem()">Next →</button>
        </div>

        <div class="log">
            <strong>Decision Log</strong>
            ${decisions.map(d => `
                <div class="log-entry">
                    ${d.title} → ${d.decision}<br/>
                    <em>${d.notes || "No notes"}</em>
                </div>
            `).join("")}
        </div>
    `;
}

function decide(decision){
    const notes = document.getElementById("notes").value;

    decisions.push({
        title: data[currentIndex].title,
        decision,
        notes
    });

    data[currentIndex].status = decision;
    nextItem();
}

function nextItem(){
    if(currentIndex < data.length - 1){
        currentIndex++;
    }
    render();
}

function render(){
    renderList();
    renderDetails();
}

render();
</script>

</body>
</html>
